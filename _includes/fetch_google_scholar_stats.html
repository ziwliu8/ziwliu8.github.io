<script>
    document.addEventListener("DOMContentLoaded", function () {
        var cacheKey = Math.floor(Date.now() / 3600000);
        var sources = [
            "https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json?v=" + cacheKey,
            "https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json?v=" + cacheKey
        ];

        function loadCitationData(index) {
            if (index >= sources.length) {
                console.warn("Google Scholar citation data is temporarily unavailable.");
                return;
            }

            fetch(sources[index], { cache: "no-store" })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("HTTP " + response.status);
                    }
                    return response.json();
                })
                .then(function (data) {
                    if (!Number.isInteger(data.citedby) || !data.publications) {
                        throw new Error("Invalid Google Scholar data");
                    }

                    var totalCitationEle = document.getElementById("total_cit");
                    if (totalCitationEle) {
                        var displayedCitation = Number.parseInt(
                            totalCitationEle.textContent,
                            10
                        );
                        if (!Number.isInteger(displayedCitation) || data.citedby >= displayedCitation) {
                            totalCitationEle.textContent = data.citedby;
                            if (data.updated) {
                                totalCitationEle.title = "Last updated: " + data.updated;
                            }
                        }
                    }

                    var citationEles = document.getElementsByClassName("show_paper_citations");
                    Array.prototype.forEach.call(citationEles, function (element) {
                        var publication = data.publications[element.getAttribute("data")];
                        if (publication && Number.isInteger(publication.num_citations)) {
                            element.textContent = "| Citations: " + publication.num_citations;
                        }
                    });
                })
                .catch(function () {
                    loadCitationData(index + 1);
                });
        }

        loadCitationData(0);
    });
</script>
